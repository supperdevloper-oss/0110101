name: Publish Paraveda CRM v3.106 ZIP

on:
  push:
    branches:
      - arena/132dd37b-0110101
    paths:
      - .github/workflows/publish-crm-zip.yml
      - Paraveda-CRM-fix-v3.106.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the fix branch
        uses: actions/checkout@v4
        with:
          ref: arena/132dd37b-0110101

      - name: Verify the ZIP before publishing
        run: |
          set -e
          test -f Paraveda-CRM-fix-v3.106.zip
          echo "324760cfb48385f948bc9ea5b9b341d884675e8b2f327dbd2b606be8f101192f  Paraveda-CRM-fix-v3.106.zip" | sha256sum -c -
          unzip -t Paraveda-CRM-fix-v3.106.zip

      - name: Attach ZIP to release v3.106
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view v3.106 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v3.106 --repo "$GITHUB_REPOSITORY" \
              --target arena/132dd37b-0110101 \
              --title "Paraveda CRM fix v3.106 — تحميل مباشر" \
              --notes "الملفات المصلّحة بلا پاسوورد: غير 6 ملفات، بلا داتا ولا سجلات. v3.106 كيصلّح فيلتر اليوم على الهاتف + ct القديم."
          fi
          gh release upload v3.106 Paraveda-CRM-fix-v3.106.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release view v3.106 --repo "$GITHUB_REPOSITORY" --json tagName,url,assets
